# Starting weights for the crop model; see SPEC.md "Starting weights" for the reasoning.
# Override any of them on the command line, e.g. --gamma=0.2.

# Per page-of-ink cut off (cut cells / the paper's median ink per page).
alpha=1.0
# Per unit of off-centredness (content-centre displacement in window widths + window heights).
beta=0.1
# Per window beyond the first.
gamma=0.05
# Per page turn that changes window.
delta=0.0
# Per page whose window differs from the one two pages back (jitter and one-off windows,
# but not a steady left/right alternation).
delta2=0.02
maxWindows=3
